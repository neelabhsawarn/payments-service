name: Build and integration tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Runner provides Docker; Failsafe integration tests boot real Kafka + PostgreSQL.
      - name: Compile, unit tests, and integration tests
        run: mvn -B -ntp clean verify
      - name: Build container image
        run: docker build -t payments-service:ci .
